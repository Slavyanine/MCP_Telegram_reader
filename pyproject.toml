[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-acl-mcp"
version = "0.2.0"
description = "Telegram ACL reader with optional indexed search and native voice transcription"
requires-python = ">=3.11"
dependencies = ["mcp==1.26.0", "Telethon==1.42.0", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[project.scripts]
telegram-acl-mcp = "telegram_acl_mcp.server:main"
telegram-acl-admin = "telegram_acl_mcp.admin:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
